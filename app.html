<title>Ribs Down</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first single column (max 560px), sticky top bar, bottom tab bar, full-screen pace-clock player overlay. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E8ECF3; --fg:#141A24; --fg-2:#4A5566; --fg-3:#7A8595; --line:#D5DBE5;
  --accent:#1D4ED8; --accent-fg:#FFFFFF; --accent-soft:#DDE6FB;
  --hand:#E4572E; --hand-soft:#FBE3DA;
  --good:#1B8A5A; --good-soft:#D9F2E5; --warn:#B8730A; --warn-soft:#FBEBCF; --bad:#C0392B; --bad-soft:#F8DAD6;
  --display:'Barlow Condensed','Arial Narrow',sans-serif-condensed,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:14px; --shadow:0 1px 2px rgba(20,26,36,.06),0 6px 18px rgba(20,26,36,.06);
  --heat-0:#E6EAF1; --heat-1:#BFD0F5; --heat-2:#86A4EC; --heat-3:#4A74DF; --heat-4:#1D4ED8;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1218; --surface:#161C25; --surface-2:#1F2732; --fg:#EEF2F7; --fg-2:#B3BDCA; --fg-3:#7F8A99; --line:#2A3340;
  --accent:#7A9BFF; --accent-fg:#0E1218; --accent-soft:#1E2A48;
  --hand:#FF7A52; --hand-soft:#3A2419;
  --good:#3DBE7E; --good-soft:#133224; --warn:#E3A33B; --warn-soft:#3A2C10; --bad:#E5604F; --bad-soft:#3B1C19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --heat-0:#1F2732; --heat-1:#2A3C66; --heat-2:#3A58A3; --heat-3:#5A7DE0; --heat-4:#7A9BFF;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1218; --surface:#161C25; --surface-2:#1F2732; --fg:#EEF2F7; --fg-2:#B3BDCA; --fg-3:#7F8A99; --line:#2A3340;
  --accent:#7A9BFF; --accent-fg:#0E1218; --accent-soft:#1E2A48;
  --hand:#FF7A52; --hand-soft:#3A2419;
  --good:#3DBE7E; --good-soft:#133224; --warn:#E3A33B; --warn-soft:#3A2C10; --bad:#E5604F; --bad-soft:#3B1C19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --heat-0:#1F2732; --heat-1:#2A3C66; --heat-2:#3A58A3; --heat-3:#5A7DE0; --heat-4:#7A9BFF;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,.btn,.switch,.habit,.tabs button,.rpe button,.days button,.alt,.slot,.hist{touch-action:manipulation;-webkit-user-select:none;user-select:none}
#player,#sheet .panel{-webkit-overflow-scrolling:touch}
.install{border:1px solid var(--accent)}
.install ol{padding-left:1.2rem;margin:0;font-size:.9rem}
.install li{margin:.2rem 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.2rem} h4{font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.5rem .65rem;max-width:100%}
input[type=number]{width:6.5rem}
input[type=time],input[type=date]{min-width:0}
textarea{width:100%;min-height:4rem;resize:vertical}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}
.small{font-size:.875rem} .tiny{font-size:.78rem}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-block:.6rem .4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.brand{display:flex;align-items:center;gap:.55rem}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--fg);display:grid;place-items:center;color:var(--bg)}
.brand h1{font-size:1.35rem;letter-spacing:.02em}
.brand .tag{font-size:.72rem;color:var(--fg-3);letter-spacing:.08em;text-transform:uppercase;font-family:var(--display);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .6rem;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.hand{background:var(--hand-soft);color:var(--hand)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ghost{background:transparent;border:1px solid var(--line)}
main{flex:1;padding-block:.25rem 6.5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:1rem}
section.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem;display:flex;flex-direction:column;gap:.75rem;min-width:0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:.5rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
@media (max-width:380px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.65rem 1rem;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-height:44px;line-height:1.2;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.hand{background:var(--hand);color:#fff;border-color:var(--hand)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--accent)}
.btn.soft{background:var(--surface-2);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.big{font-family:var(--display);font-size:1.35rem;padding:.9rem 1.2rem;letter-spacing:.02em;min-height:56px}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:.4rem .7rem;min-height:36px;font-size:.875rem;border-radius:10px}
.icon{width:1.1em;height:1.1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs .inner{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.55rem 0 .5rem;font-size:.72rem;font-weight:600;color:var(--fg-3);letter-spacing:.02em}
.tabs button .icon{width:22px;height:22px}
.tabs button[aria-current=page]{color:var(--accent)}

/* Today */
.hero{display:flex;flex-direction:column;gap:.35rem}
.hero .date{font-family:var(--display);font-size:1.9rem;font-weight:600;line-height:1}
.quote{border-left:3px solid var(--hand);padding:.15rem .75rem;color:var(--fg-2);font-style:italic}
.seg{display:flex;align-items:center;gap:.75rem;padding:.6rem 0;border-top:1px solid var(--line)}
.seg:first-of-type{border-top:0}
.seg .st{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--line);color:var(--fg-3);font-family:var(--display);font-weight:700;font-size:.85rem}
.seg .st.done{background:var(--good);border-color:var(--good);color:#fff}
.seg .st.next{border-color:var(--accent);color:var(--accent)}
.seg .body{flex:1;min-width:0}
.seg .body b{display:block;font-weight:600}
.seg .body span{display:block;font-size:.85rem;color:var(--fg-2)}
.habits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
.habit{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:.55rem .25rem;border-radius:12px;border:1px solid var(--line);font-size:.75rem;font-weight:600;color:var(--fg-2);text-align:center;line-height:1.15;min-height:64px;justify-content:center}
.habit .icon{width:20px;height:20px}
.habit[aria-pressed=true]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
@media (max-width:380px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:.6rem .5rem;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:.1rem;min-width:0}
.kpi b{font-family:var(--display);font-size:1.7rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.72rem;color:var(--fg-3);letter-spacing:.05em;text-transform:uppercase;font-family:var(--display);font-weight:600}
.xpbar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}

/* Plan */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.3rem}
.day{border-radius:10px;border:1px solid var(--line);padding:.4rem .2rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.7rem;color:var(--fg-2);min-width:0;text-align:center;line-height:1.15}
.day b{font-family:var(--display);font-size:1rem;color:var(--fg)}
.day.today{border-color:var(--accent);background:var(--accent-soft)}
.day .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.day .dot.A{background:var(--accent)} .day .dot.B{background:var(--hand)} .day .dot.run{background:var(--good)} .day .dot.done{box-shadow:0 0 0 2px var(--good)}
.slot{display:flex;gap:.7rem;align-items:center;padding:.6rem 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot .fig{width:72px;height:48px;flex:none;border-radius:8px;background:var(--surface-2);overflow:hidden}
.slot .fig svg{width:100%;height:100%;display:block}
.slot .body{flex:1;min-width:0}
.slot .body b{display:block;font-weight:600;line-height:1.2}
.slot .body span{display:block;font-size:.82rem;color:var(--fg-2)}
.lvl{display:inline-block;font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.06em;padding:.05rem .4rem;border-radius:6px;background:var(--surface-2);color:var(--fg-2);vertical-align:middle}
figure.ex{margin:0;background:var(--surface-2);border-radius:12px;overflow:hidden;max-width:100%}
figure.ex svg{display:block;width:100%;height:auto;max-width:100%}
.figure-stage{stroke:var(--fg);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.figure-stage .far{opacity:.42}
.figure-stage .head{fill:var(--fg);stroke:none}
.figure-stage .prop{stroke:var(--fg-3);stroke-width:2.2;fill:var(--surface)}
.figure-stage .floor{stroke:var(--line);stroke-width:1.5}
.figure-stage .bp{fill:var(--hand);stroke:none}
.figure-stage .towel{stroke:var(--accent);stroke-width:2.5}
.figure-stage .ghost{opacity:.22}
.howto{display:grid;grid-template-columns:auto 1fr;gap:.3rem .6rem;font-size:.9rem;align-items:baseline}
.howto dt{color:var(--fg-3);font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem}
.howto dd{margin:0}
.alt{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;padding:.55rem;border-radius:12px;border:1px solid var(--line)}
.alt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.alt .fig{width:60px;height:40px;background:var(--surface-2);border-radius:8px;flex:none;overflow:hidden}
.alt .fig svg{width:100%;height:100%}
.alt b{display:block;line-height:1.15} .alt span{font-size:.8rem;color:var(--fg-2)}

/* Progress */
.chart{width:100%;height:auto;display:block;max-width:100%;overflow:visible}
.chart text{font-family:var(--body);font-size:11px;fill:var(--fg-3)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.12}
.chart .band{fill:var(--good);opacity:.12}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .dot.end{r:5}
.chart .bar{fill:var(--accent)}
.chart .bar.hand{fill:var(--hand)}
.chart .hit{fill:transparent}
.chart .cursor{stroke:var(--fg-3);stroke-dasharray:3 3}
.chart .lbl{fill:var(--fg-2);font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);padding:.3rem .5rem;border-radius:8px;font-size:.78rem;white-space:nowrap;transform:translate(-50%,-110%);z-index:5;box-shadow:var(--shadow)}
.chart-wrap{position:relative}
.heat{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--heat-0)}
.heat i.l1{background:var(--heat-1)} .heat i.l2{background:var(--heat-2)} .heat i.l3{background:var(--heat-3)} .heat i.l4{background:var(--heat-4)}
.heat i.today{box-shadow:inset 0 0 0 2px var(--hand)}
.heat-legend{display:flex;align-items:center;gap:.3rem;font-size:.72rem;color:var(--fg-3);justify-content:flex-end}
.heat-legend i{width:10px;height:10px;border-radius:2px;background:var(--heat-0);display:inline-block}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.badge{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:.6rem .3rem;border-radius:12px;border:1px solid var(--line);text-align:center;font-size:.75rem;line-height:1.15;min-width:0}
.badge .ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--fg-3);font-family:var(--display);font-weight:700;font-size:.95rem}
.badge.on .ring{background:var(--accent);color:var(--accent-fg)}
.badge.on{border-color:var(--accent)}
.badge:not(.on){opacity:.6}
.badge b{font-weight:600}
.hist{display:flex;gap:.6rem;align-items:center;padding:.55rem 0;border-top:1px solid var(--line);width:100%;text-align:left}
.hist:first-child{border-top:0}
.hist .type{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;flex:none;background:var(--surface-2);color:var(--fg-2)}
.hist .type.A{background:var(--accent-soft);color:var(--accent)} .hist .type.B{background:var(--hand-soft);color:var(--hand)} .hist .type.run{background:var(--good-soft);color:var(--good)}
.hist .body{flex:1;min-width:0} .hist .body b{display:block} .hist .body span{display:block;font-size:.82rem;color:var(--fg-2)}
table.data{width:100%;border-collapse:collapse;font-size:.85rem}
table.data th,table.data td{text-align:left;padding:.3rem .4rem;border-bottom:1px solid var(--line)}
table.data th{font-family:var(--display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:.7rem;color:var(--fg-3)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.875rem}
.twrap{overflow-x:auto}

/* More / settings */
.field{display:flex;flex-direction:column;gap:.3rem}
.field label{font-size:.82rem;font-weight:600;color:var(--fg-2)}
.field-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.55rem 0;border-top:1px solid var(--line)}
.field-row:first-child{border-top:0}
.field-row .lab{display:flex;flex-direction:column;min-width:0}
.field-row .lab b{font-weight:600}
.field-row .lab span{font-size:.8rem;color:var(--fg-2)}
.switch{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked=true]{background:var(--good)}
.switch[aria-checked=true]::after{left:23px}
.days{display:flex;gap:.3rem;flex-wrap:wrap}
.days button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:.9rem;color:var(--fg-2)}
.days button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.rules li{margin:.2rem 0}
ul{padding-left:1.2rem;margin:0}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{background:var(--surface);color:var(--fg);width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;border-radius:18px 18px 0 0;padding-block:.5rem calc(1rem + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:.8rem}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto .2rem}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
.sheet-head>div:first-child{flex:1;min-width:0}
.sheet-head>.btn{flex:none}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);padding:.6rem .9rem;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

/* Player (pace clock) */
#player{position:fixed;inset:0;z-index:15;background:var(--bg);color:var(--fg);display:flex;justify-content:center;overflow:auto}
#player .wrap{width:100%;max-width:560px;display:flex;flex-direction:column;min-height:100%;padding-block:calc(.5rem + env(safe-area-inset-top,0px)) calc(1rem + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:.7rem}
.phead{display:flex;align-items:center;gap:.6rem}
.phead .crumbs{flex:1;min-width:0}
.phead .crumbs b{display:block;font-family:var(--display);font-size:1.05rem;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .crumbs span{display:block;font-size:.78rem;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptimes{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.ptimes b{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.ptimes span{font-size:.72rem;color:var(--fg-3);white-space:nowrap}
.segbar{display:flex;gap:3px}
.segbar i{flex:1;height:5px;border-radius:3px;background:var(--surface-2);position:relative;overflow:hidden}
.segbar i::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--accent);border-radius:3px;transition:width .3s}
.segbar i.core::after{background:var(--hand)}
.pausebar{display:flex;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);padding:.45rem .75rem;border-radius:10px;font-weight:600}
.xcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}

const GOALS = {

  hinge:    {name:'Hip hinge',              why:'Hamstrings and glutes with a flat back. Most of the lower-back strengthening lives here.'},

[

const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const STANDALONE = navigator.standalone===true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
const IN_CLAUDE = !!(window.claude && typeof window.claude.use==='function');
const STAND = {head:[50,9],neck:[50,16],sh:[50,18],el:[51,30],hd:[52,41],hip:[50,38],kn:[50,54],ft:[50,72]};
function pose(base, over){ return Object.assign({}, base, over); }
function unit(a,b){ const dx=a[0]-b[0], dy=a[1]-b[1], l=Math.hypot(dx,dy)||1; return [dx/l,dy/l]; }
// Straight-body plank family: pivot (foot or knee), body length, neck height, hands on the floor.
function plank(pivot, L, neckY, handX, opt={}){
  const nx = pivot[0]-Math.sqrt(Math.max(0,L*L-(pivot[1]-neckY)**2));
  const neck=[nx,neckY];
  const at=t=>[neck[0]+(pivot[0]-neck[0])*t, neck[1]+(pivot[1]-neck[1])*t];
  const hip=at(opt.hipT??0.5), kn=opt.knee?pivot:at(0.76);
  const u=unit(neck,hip); const head=[neck[0]+u[0]*7, neck[1]+u[1]*7+1.5];
  const sh=[neck[0]+2,neck[1]+1], hd=[handX,72];
  const mid=[(sh[0]+hd[0])/2,(sh[1]+hd[1])/2]; const v=[hd[0]-sh[0],hd[1]-sh[1]]; const vl=Math.hypot(v[0],v[1])||1;

  }

  if(f.bp){ const pa=bpPos(A,f.bp), pb=bpPos(B,f.bp); out+=`<rect class="bp" x="${pa[0]}" y="${pa[1]}" width="8" height="11" rx="2">${anim('x',pa[0],pb[0])}${anim('y',pa[1],pb[1])}</rect>`; }

/* =========================================================
   3. STATE, PERSISTENCE, SCHEDULE, PROGRESSION
   ========================================================= */
const KEY='ribsdown.v1', SKEY='ribsdown.session', RKEY='ribsdown.reminded';
const pad2=n=>String(n).padStart(2,'0');

const fmtPace=(sec,miles)=>{ if(!miles||!sec) return '--'; const p=sec/miles; return `${Math.floor(p/60)}:${pad2(Math.round(p%60))}`; };
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));

const DEFAULT={
  v:1,
  profile:{name:'Andrew', start:'2026-11-02', weightLb:0, restSec:60, blockRestSec:15, sound:true, vibrate:true, extras:false, units:'mi', core:{on:true, minutes:5, sunday:true},
    runDays:[2,4,0], longRunDay:0, gymDays:[], reminder:{on:false,time:'07:00',days:[1,2,3,4,5,6,0]}, posture:{on:false,min:45}, rotateWeeks:4, hasBar:false},
  levels:{}, run:{easy:1, long:1.5, bestPace:null, targetPace:null}, core:{work5:40, work10:50}, coreOverride:null, coreSeed:0, badges:{}, xp:0, habits:{}, weights:[], rotation:{lastWeek:1}, movedUp:0,
};
let state=clone(DEFAULT), workouts=[];
function merge(def,o){ const out=clone(def); if(!o) return out; for(const k of Object.keys(o)){ if(o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k])&&def[k]&&typeof def[k]==='object'&&!Array.isArray(def[k])) out[k]=Object.assign({},def[k],o[k]); else out[k]=o[k]; } return out; }

const Store={
  db:null, timer:null, lastWritten:'', synced:false, hadLocal:false,
  load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); state=merge(DEFAULT,o.state); workouts=o.workouts||[]; this.hadLocal=true; } }catch(e){} },
  local(){ try{ localStorage.setItem(KEY, JSON.stringify({state,workouts})); }catch(e){} },
  saveState(){ this.local(); if(this.db){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(),500); } },
  async flush(){ const j=JSON.stringify(state); if(j===this.lastWritten) return; this.lastWritten=j; try{ await this.db.doc('app/state').set(JSON.parse(j)); }catch(e){ console.warn(e); } },
  async saveWorkout(w){ this.local(); if(this.db){ try{ await this.db.collection('workouts').doc(w.id).set(clone(w)); }catch(e){ toast('Saved on this device only'); } } },
  async deleteWorkout(id){ this.local(); if(this.db){ try{ await this.db.collection('workouts').doc(id).delete(); }catch(e){} } },
  async connect(){
    if(!(window.claude&&typeof window.claude.use==='function')) return;
    let db=null; try{ db=await window.claude.use('db'); }catch(e){} if(!db) return; this.db=db;
    try{
      const snap=await db.doc('app/state').get();
      const q=await db.collection('workouts').limit(1000).get();
      if(snap.exists){ state=merge(DEFAULT,snap.data()); this.lastWritten=JSON.stringify(state); }
      else if(this.hadLocal){ this.lastWritten=JSON.stringify(state); await db.doc('app/state').set(clone(state)); }
      if(!q.empty){ workouts=q.docs.map(d=>d.data()).filter(Boolean).sort((a,b)=>a.ts-b.ts); }
      else if(workouts.length){ for(const w of workouts){ await db.collection('workouts').doc(w.id).set(clone(w)); } }
      this.synced=true; this.local(); render();
      db.doc('app/state').onSnapshot(s=>{ if(!s.exists||s.metadata.hasPendingWrites) return; const j=JSON.stringify(merge(DEFAULT,s.data())); if(j!==JSON.stringify(state)){ state=JSON.parse(j); this.lastWritten=j; this.local(); if(!S) render(); } }, e=>console.warn(e));
      db.collection('workouts').onSnapshot(s=>{ if(s.metadata.hasPendingWrites) return; const list=s.docs.map(d=>d.data()).filter(Boolean).sort((a,b)=>a.ts-b.ts); if(JSON.stringify(list)!==JSON.stringify(workouts)){ workouts=list; this.local(); if(!S) render(); } }, e=>console.warn(e));
    }catch(e){ console.warn('store',e); }
  }
};

/* ---- schedule ---- */
function programWeek(k=todayKey()){ const days=Math.round((fromKey(k)-fromKey(state.profile.start))/864e5); return Math.max(1,Math.floor(days/7)+1); }
function lastStrength(){ for(let i=workouts.length-1;i>=0;i--){ const w=workouts[i]; if(w.type==='A'||w.type==='B') return w; } return null; }
function nextStrengthType(k=todayKey()){ const ls=lastStrength(); const dow=fromKey(k).getDay(); if(!ls) return [1,3,5].includes(dow)?'A':'B'; if(ls.date===k) return ls.type; return ls.type==='A'?'B':'A'; }
function dayPlan(k=todayKey()){
  const dow=fromKey(k).getDay(), p=state.profile, segs=[{kind:'block'}];
  const gym=p.gymDays.includes(dow);
  if(dow===0){ if(!p.runDays.includes(0)) segs.push({kind:'walk'}); }
  else if(!gym) segs.push({kind:nextStrengthType(k)});
  if(p.core&&p.core.on&&!gym&&(dow!==0||p.core.sunday)) segs.push({kind:'core', minutes:p.core.minutes});
  if(p.runDays.includes(dow)) segs.push({kind:'run', runKind: dow===p.longRunDay?'long':'easy', miles: dow===p.longRunDay?state.run.long:state.run.easy});
  if(gym) segs.push({kind:'gym'});
  return segs;
}
function doneOn(k,kind){ return workouts.some(w=>w.date===k && (kind==='block' ? (w.block||w.type==='block') : kind==='core' ? !!w.core : w.type===kind)); }
function segName(s){ return s.kind==='block'?'Back & Pelvis Block': s.kind==='A'?'Day A: Push + Legs': s.kind==='B'?'Day B: Pull + Hinge': s.kind==='run'?(s.runKind==='long'?'Long run':'Easy run'): s.kind==='core'?'Core finisher': s.kind==='walk'?'Walk': s.kind==='gym'?'Gym session':'Session'; }

/* ---- levels ---- */
function level(slotId){ const s=SLOT[slotId]; let l=state.levels[slotId]; if(!l||!EX[l.ex]){ const e=EX[s.def]; l=state.levels[slotId]={ex:e.id, target:e.range?e.range[0]:null, hold:e.hold?e.hold[0]:null, load:0}; } return l; }
function slotEx(slotId){ return EX[level(slotId).ex]; }
function setSlotEx(slotId, exId, keepLoad){ const e=EX[exId]; const l=level(slotId); state.levels[slotId]={ex:exId, target:e.range?e.range[0]:null, hold:e.hold?e.hold[0]:null, load:(keepLoad&&e.loadable)?l.load:0}; }
function targetText(slotId){ const s=SLOT[slotId], e=slotEx(slotId), l=level(slotId); let t;
  if(e.mode==='time') t=`${s.sets} × ${l.hold}s${e.perSide?' per side':''}`; else t=`${s.sets} × ${l.target}${e.perSide?' per side':''}`;
  if(l.load) t+=` · ${l.load} lb pack`; return t; }
function family(exId){ const seen=new Set(); let e=EX[exId]; while(e&&e.easier&&!seen.has(e.easier)){ seen.add(e.id); e=EX[e.easier]; } const out=[]; const s2=new Set(); while(e&&!s2.has(e.id)){ s2.add(e.id); out.push(e.id); e=EX[e.harder]; } return out; }
function mixSlot(slotId, quiet){ const s=SLOT[slotId], cur=slotEx(slotId), fam=family(cur.id);
  let alts=s.options.filter(id=>!fam.includes(id)&&Math.abs(EX[id].level-cur.level)<=1&&!(EX[id].equip.includes('bar')&&!state.profile.hasBar));
  if(!alts.length) alts=s.options.filter(id=>!fam.includes(id)&&!(EX[id].equip.includes('bar')&&!state.profile.hasBar));
  if(!alts.length) return null; const pick=alts[Math.floor(Math.random()*alts.length)]; setSlotEx(slotId,pick,true); return pick; }

/* ---- progression ---- */
function progressSlot(slotId, entry, eff){
  const s=SLOT[slotId], e=EX[entry.ex], l=level(slotId); if(l.ex!==e.id) return null;
  const sets=entry.sets||[]; if(!sets.length) return null;
  const name=e.name;
  if(e.mode==='time'){
    const held=Math.min(...sets.map(x=>x.sec||0));
    if(held>=l.hold-1 && eff<=7){ const nh=l.hold+5; if(nh>e.hold[1] && e.harder){ setSlotEx(slotId,e.harder,true); state.movedUp=(state.movedUp||0)+1; return {dir:'up',text:`${name} → ${EX[e.harder].name}. You held the top of the range, so you move up.`}; }
      l.hold=Math.min(nh,e.hold[1]); return {dir:'up',text:`${name}: hold ${l.hold}s next time.`}; }
    if(eff>=9 && held<l.hold-5){ if(e.easier&&l.hold<=e.hold[0]){ setSlotEx(slotId,e.easier,true); return {dir:'down',text:`${name} → ${EX[e.easier].name}. Build back up from there.`}; } l.hold=Math.max(e.hold[0],l.hold-5); return {dir:'down',text:`${name}: hold ${l.hold}s. Shorter and cleaner.`}; }
    return {dir:'same',text:`${name}: keep ${l.hold}s.`};
  }
  const reps=sets.map(x=>x.reps||0); const avg=reps.reduce((a,b)=>a+b,0)/reps.length; const lo=Math.min(...reps);
  const topHit=lo>=e.range[1], bottomMiss=lo<e.range[0];
  if(topHit && eff<=7){
    if(e.harder && !(EX[e.harder].equip.includes('bar')&&!state.profile.hasBar)){ setSlotEx(slotId,e.harder,true); state.movedUp=(state.movedUp||0)+1; return {dir:'up',text:`${name} → ${EX[e.harder].name}. You hit the top of the range on every set.`}; }
    if(e.loadable){ l.load=(l.load||0)+5; l.target=e.range[0]; return {dir:'up',text:`${name}: add about 5 lb of books to the backpack (${l.load} lb). Target drops to ${l.target} reps.`}; }
    l.target=e.range[1]; return {dir:'up',text:`${name}: maxed out. Slow the lowering to 3 seconds, or swap it on the Plan tab.`};
  }
  if(bottomMiss && eff>=9){
    if(e.easier && !l.load){ setSlotEx(slotId,e.easier,true); return {dir:'down',text:`${name} → ${EX[e.easier].name}. Own the easier version first.`}; }
    if(l.load){ l.load=Math.max(0,l.load-5); return {dir:'down',text:`${name}: take 5 lb out of the backpack (${l.load} lb).`}; }
    l.target=e.range[0]; return {dir:'down',text:`${name}: aim for ${l.target} clean reps.`};
  }
  const bump=eff<=5?2:eff<=8?1:0; l.target=clamp(Math.round(avg)+bump,e.range[0],e.range[1]);
  return {dir:bump?'up':'same',text:`${name}: aim for ${l.target} reps${bump?' (up from '+Math.round(avg)+')':''}.`};
}
function progressRun(kind, miles, sec, rpe){
  const r=state.run, key=kind==='long'?'long':'easy', max=kind==='long'?4:2.5, step=kind==='long'?0.5:0.25;
  const before=r[key]; let text; let dir='same';
  if(miles>=before-0.05){
    if(rpe<=5){ r[key]=Math.min(max,before+step); dir='up'; }
    else if(rpe<=7){ r[key]=Math.min(max,before+0.25); dir='up'; }
    else if(rpe>=9){ r[key]=Math.max(1,before-0.25); dir='down'; }
  } else if(rpe>=8){ r[key]=Math.max(1,Math.round(miles*4)/4); dir='down'; }
  r[key]=Math.round(r[key]*4)/4;
  const pace=sec/miles; if(!r.bestPace||pace<r.bestPace) r.bestPace=pace;
  if(r[key]===before) text=`${kind==='long'?'Long':'Easy'} run stays at ${r[key]} mi.`;
  else text=`${kind==='long'?'Long':'Easy'} run: ${before} → ${r[key]} mi next time${r[key]>=max?' (top of the plan)':''}.`;
  if(rpe<=6 && pace<(r.targetPace||Infinity)) r.targetPace=Math.round(pace-5);
  else if(!r.targetPace) r.targetPace=Math.round(pace);
  return {dir,text};
}

/* ---- stats ---- */
function streakInfo(){ const days=[...new Set(workouts.map(w=>w.date))].sort(); const set=new Set(days); let cur=0; let d=todayKey(); if(!set.has(d)) d=addDays(d,-1); while(set.has(d)){cur++; d=addDays(d,-1);} let best=0,run=0,prev=null; for(const k of days){ run=(prev&&addDays(prev,1)===k)?run+1:1; best=Math.max(best,run); prev=k; } return {cur,best}; }
function weekStart(k){ const d=fromKey(k); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return todayKey(d); }
function statsAll(){
  const st={total:workouts.length, blocks:0, cores:0, strength:0, countA:0, countB:0, miles:0, longestRun:0, minutes:0, pushup20:false, movedUp:state.movedUp||0, early:false, late:false, perfectWeek:false, week:programWeek()};
  const perWeek={};
  for(const w of workouts){ if(w.core) st.cores++; if(w.block||w.type==='block') st.blocks++; if(w.type==='A'||w.type==='B'){st.strength++; st[w.type==='A'?'countA':'countB']++;} if(w.type==='run'&&w.run){ st.miles+=w.run.miles; st.longestRun=Math.max(st.longestRun,w.run.miles);} st.minutes+=(w.durSec||0)/60;
    const hr=new Date(w.ts).getHours(); if(hr<7) st.early=true; if(hr>=21) st.late=true;
    const ws=weekStart(w.date); (perWeek[ws]=perWeek[ws]||new Set()).add(w.date);
    for(const [sid,en] of Object.entries(w.exercises||{})){ if(/^pushup/.test(en.ex)&&en.ex!=='pushup_knee'&&(en.sets||[]).some(s=>(s.reps||0)>=20)) st.pushup20=true; } }
  st.perfectWeek=Object.values(perWeek).some(s=>s.size>=7);
  const sk=streakInfo(); st.streak=sk.cur; st.bestStreak=sk.best; st.miles=Math.round(st.miles*100)/100;
  return st;
}
function checkBadges(){ const st=statsAll(); const won=[]; for(const b of BADGES){ if(!state.badges[b.id] && b.test(st)){ state.badges[b.id]=todayKey(); won.push(b);} } return won; }
function xpFor(w){ let xp=0; if(w.core) xp+=15; if(w.block||w.type==='block') xp+=30; if(w.type==='A'||w.type==='B') xp+=60; if(w.type==='run') xp+=Math.round(25*(w.run?.miles||0)); if(w.type==='walk') xp+=15; if(w.type==='gym') xp+=40; if(w.rpe>=6&&w.rpe<=8) xp+=10; return xp; }
const LEVEL_NAMES=['Starting out','Showing up','Consistent','Committed','Strong','Stacked','Neutral by default','Unshakeable'];
function xpLevel(xp){ const n=Math.floor(xp/400); return {n:n+1, name:LEVEL_NAMES[Math.min(n,LEVEL_NAMES.length-1)], into:xp%400, pct:Math.round((xp%400)/4)}; }
function quoteOfDay(){ const d=Math.floor(Date.now()/864e5); return QUOTES[d%QUOTES.length]; }
function proteinTarget(){ const w=state.profile.weightLb; return w?`${Math.round(w*0.7)}–${Math.round(w)} g`:'0.7–1 g per lb of bodyweight'; }

/* ---- Today ---- */
function viewToday(){

function lineChart({pts, yMin, yMax, band, fmt=v=>v, w=340, h=150, suffix='', ticks}){
  if(!pts.length) return `<p class="small faint">Nothing logged yet.</p>`;
  const L=34,R=12,T=12,B=26, iw=w-L-R, ih=h-T-B;
  const ys=pts.map(p=>p.y); const lo=yMin??Math.min(...ys), hi=yMax??Math.max(...ys); const span=(hi-lo)||1;
  const X=i=>pts.length===1?L+iw/2:L+iw*i/(pts.length-1), Y=v=>T+ih-(v-lo)/span*ih;
  ticks=ticks||[lo,lo+span/2,hi].map(t=>Number.isInteger(span)&&span%2===0?t:Math.round(t*10)/10);
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Chart">`;
  if(band) s+=`<rect class="band" x="${L}" y="${Y(band[1])}" width="${iw}" height="${Y(band[0])-Y(band[1])}"/>`;
  ticks.forEach(t=>{ s+=`<line class="grid" x1="${L}" x2="${L+iw}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end">${fmt(t)}</text>`; });
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  if(pts.length>1) s+=`<path class="area" d="${path} L${X(pts.length-1).toFixed(1)},${T+ih} L${L},${T+ih} Z"/><path class="line" d="${path}"/>`;
  pts.forEach((p,i)=>{ const end=i===pts.length-1; s+=`<circle class="dot${end?' end':''}" cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${end?5:3.5}"/>`; if(p.mark) s+=`<text class="lbl" x="${X(i).toFixed(1)}" y="${Y(p.y)-9}" text-anchor="middle">${esc(p.mark)}</text>`; });
  const step=pts.length>1?iw/(pts.length-1):iw;
  pts.forEach((p,i)=>{ s+=`<rect class="hit" x="${(X(i)-step/2).toFixed(1)}" y="${T}" width="${step.toFixed(1)}" height="${ih}" data-tip="${esc(p.x)}: ${esc(fmt(p.y))}${suffix}${p.sub?' · '+esc(p.sub):''}"/>`; });
  const lab=i=>`<text x="${X(i).toFixed(1)}" y="${h-8}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${esc(pts[i].x)}</text>`;
  s+=lab(0); if(pts.length>2) s+=lab(Math.floor((pts.length-1)/2)); if(pts.length>1) s+=lab(pts.length-1);
  return s+'</svg>';
}
function barChart({pts, fmt=v=>v, w=340, h=140, suffix='', cls=''}){
  if(!pts.length) return `<p class="small faint">Nothing logged yet.</p>`;
  const L=34,R=8,T=10,B=26, iw=w-L-R, ih=h-T-B; const hi=Math.max(1,...pts.map(p=>p.y));
  const bw=iw/pts.length; let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Bar chart">`;
  [0,hi/2,hi].forEach(t=>{ const y=T+ih-t/hi*ih; s+=`<line class="grid" x1="${L}" x2="${L+iw}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmt(t)}</text>`; });
  pts.forEach((p,i)=>{ const bh=p.y/hi*ih, x=L+i*bw+2, y=T+ih-bh; s+=`<rect class="bar ${cls}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${bh.toFixed(1)}" rx="3"/><rect class="hit" x="${(L+i*bw).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${ih}" data-tip="${esc(p.x)}: ${esc(fmt(p.y))}${suffix}"/>`; if(i===0||i===pts.length-1||pts.length<=6) s+=`<text x="${(x+(bw-4)/2).toFixed(1)}" y="${h-8}" text-anchor="middle">${esc(p.x)}</text>`; });
  return s+'</svg>';
}

async function saveFile(name, data, mime){
  if(window.claude&&window.claude.use){ try{ const dl=await window.claude.use('downloads'); if(dl){ await dl.save({filename:name, data}); return true; } }catch(e){ if(e&&e.code==='declined') return false; } }

/* =========================================================
   5. SESSION PLAYER — preview, set logging, holds, rests, core circuit, finish
   ========================================================= */
let S=null, tickTimer=null, wakeLock=null, AC=null;
function beep(freq=880,ms=120,vol=.18){ if(!state.profile.sound) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=freq; g.gain.value=vol; o.connect(g); g.connect(AC.destination); const t=AC.currentTime; o.start(t); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+ms/1000); o.stop(t+ms/1000+0.02); }catch(e){} }
function buzz(p){ if(state.profile.vibrate&&navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }
async function keepAwake(on){ try{ if(on&&navigator.wakeLock&&!wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); } else if(!on&&wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(e){ wakeLock=null; } }
document.addEventListener('visibilitychange',()=>{ if(!S||document.visibilityState!=='visible') return; keepAwake(true); if(S.pausedAt) return;
  const overdue=(S.rest&&(now()-S.rest.until)/1000>4)||(S.u&&S.u.phase!=='idle'&&S.u.phase!=='run'&&S.u.dur&&(now()-S.u.startAt)/1000>S.u.dur+4);
  if(overdue){ S.pausedAt=Date.now(); buildUnit(); toast('Paused while the screen was off. Tap Resume to carry on.',4000); } });

const SECTION_NAME={block:'Back & Pelvis Block',A:'Day A: Push + Legs',B:'Day B: Pull + Hinge',core:'Core finisher',run:'Run',walk:'Walk',done:'Done'};
const SECTION_SHORT={block:'Block',A:'Day A',B:'Day B',core:'Core',run:'Run',walk:'Walk',done:'Done'};

/* ---- core circuit ---- */
const CORE_POOL={antiext:['hollowhold','rkcplank','revcrunch','legslower','hollow_rock','plank_tuck','bearhold','deadbug_slow'], lateral:['sideplank','sideplank_dip','copenhagen_knee','plank_reach','shouldertaps'], stable:['birddog_hold','mountainclimber_slow','deadbug_iso']};
function coreMoves(k=todayKey()){
  const o=state.coreOverride; if(o&&o.date===k&&o.moves&&o.moves.every(id=>EX[id])) return o.moves.slice(0,state.profile.core.minutes>=10?4:3);
  const blockIds=SLOTS.filter(s=>s.section==='block').map(s=>slotEx(s.id).id); const day=Math.round(fromKey(k).getTime()/864e5)+(state.coreSeed||0);
  const pick=(arr,n)=>{ const a=arr.filter(id=>!blockIds.includes(id)); return a[(day*7+n*3)%a.length]; };
  const m=[pick(CORE_POOL.antiext,0),pick(CORE_POOL.lateral,1),pick(CORE_POOL.stable,2)];
  if(state.profile.core.minutes>=10) m.push(pick(CORE_POOL.antiext.filter(x=>x!==m[0]),3));
  return m;
}
function corePlan(minutes){ const ten=minutes>=10; const work=ten?(state.core.work10||50):(state.core.work5||40); return {minutes:ten?10:5, moves:coreMoves().slice(0,ten?4:3), rounds:2, work, rest:15}; }
function coreSeconds(minutes){ const c=corePlan(minutes); return 10+c.rounds*c.moves.length*(c.work+c.rest)-c.rest; }
function progressCore(minutes, eff, done, total){ const key=minutes>=10?'work10':'work5'; const before=state.core[key]||(minutes>=10?50:40); if(done<total) return {dir:'same',text:`Core finisher: ${done} of ${total} intervals done. Work stays at ${before}s.`}; let after=before; if(eff<=6) after=Math.min(60,before+5); else if(eff>=9) after=Math.max(30,before-5); state.core[key]=after; return after===before?{dir:'same',text:`Core finisher: keep ${before}s intervals.`}:{dir:after>before?'up':'down',text:`Core finisher: ${before}s → ${after}s intervals next time.`}; }

/* ---- history helpers ---- */
function lastSetsFor(slotId, exId){ for(let i=workouts.length-1;i>=0;i--){ const en=workouts[i].exercises&&workouts[i].exercises[slotId]; if(en&&en.ex===exId&&en.sets&&en.sets.length) return {date:workouts[i].date, sets:en.sets, load:en.load||0}; } return null; }
function bestFor(exId){ let best=0; workouts.forEach(w=>Object.values(w.exercises||{}).forEach(en=>{ if(en.ex===exId) (en.sets||[]).forEach(s=>{ best=Math.max(best,s.reps||s.sec||0); }); })); return best; }
function lastVal(last, set, side){ if(!last) return null; const hit=last.sets.find(s=>s.set===set&&(side?s.side===side:!s.side)); return hit?(hit.reps??hit.sec??null):null; }

/* ---- building the session ---- */
function setUnit(s,e,set,extra){ const l=level(s.id); return Object.assign({t:'set',section:s.section,slot:s.id,ex:e.id,set,sets:s.sets,label:s.label,perSide:!!e.perSide,mode:e.mode,target:e.mode==='time'?l.hold:l.target,range:e.range||e.hold,tempo:e.tempo||3,load:l.load||0,restAfter:0,restLabel:'Rest',last:lastSetsFor(s.id,e.id)},extra||{}); }
function buildUnits(kinds,opts){
  const units=[], p=state.profile;
  for(const kind of kinds){
    if(kind==='block'){ const slots=SLOTS.filter(s=>s.section==='block'); slots.forEach((s,si)=>{ const e=slotEx(s.id); for(let set=1;set<=s.sets;set++){ const last=set===s.sets&&si===slots.length-1; units.push(setUnit(s,e,set,{restAfter:last?0:p.blockRestSec,restLabel:'Breathe'})); } }); }
    if(kind==='A'||kind==='B'){ const slots=SLOTS.filter(s=>s.section===kind&&(!s.optional||opts.extras)); const pairs=[...new Set(slots.filter(s=>s.pair).map(s=>s.pair))];
      pairs.forEach(pr=>{ const ps=slots.filter(s=>s.pair===pr); const rounds=Math.max(...ps.map(s=>s.sets)); for(let r=1;r<=rounds;r++){ ps.forEach((s,idx)=>{ const partner=ps[(idx+1)%ps.length]; const lastInRound=idx===ps.length-1; units.push(setUnit(s,slotEx(s.id),r,{superset:pr,round:r,rounds,partner:slotEx(partner.id).name,restAfter:lastInRound?p.restSec:0})); }); } });
      slots.filter(s=>!s.pair).forEach(s=>{ const e=slotEx(s.id); for(let set=1;set<=s.sets;set++) units.push(setUnit(s,e,set,{restAfter:set<s.sets?45:0})); });
      if(units.length) units[units.length-1].restAfter=0; }
    if(kind==='core'){ const c=corePlan(opts.coreMinutes||p.core.minutes); units.push({t:'lead',section:'core',sec:10,label:'Get ready',restAfter:0,core:c});
      for(let r=1;r<=c.rounds;r++) c.moves.forEach((id,mi)=>{ const e=EX[id]; const last=r===c.rounds&&mi===c.moves.length-1; units.push({t:'interval',section:'core',ex:id,round:r,rounds:c.rounds,move:mi+1,moves:c.moves.length,work:c.work,perSide:!!e.perSide,restAfter:last?0:c.rest,restLabel:'Rest'}); }); }
    if(kind==='run'){ const seg=dayPlan().find(x=>x.kind==='run')||{runKind:'easy',miles:state.run.easy}; units.push({t:'run',section:'run',runKind:opts.runKind||seg.runKind,miles:opts.miles||seg.miles,restAfter:0}); }
    if(kind==='walk') units.push({t:'walk',section:'walk',min:25,restAfter:0});
  }
  for(let i=0;i<units.length-1;i++){ const a=units[i], b=units[i+1]; if(a.section!==b.section&&!['run','walk'].includes(a.t)&&!['run','walk'].includes(b.t)&&!a.restAfter){ a.restAfter=20; a.restLabel='Breathe. Next up: '+SECTION_SHORT[b.section]; } }

}
function estUnit(u){ let s=0; if(u.t==='set') s=u.mode==='time'?(u.target*(u.perSide?2:1)+(u.perSide?6:0)+6):(u.target*u.tempo*(u.perSide?2:1)+10); else if(u.t==='interval') s=u.work; else if(u.t==='lead') s=u.sec; else if(u.t==='run') s=Math.round(u.miles*((state.run.targetPace||660))); else if(u.t==='walk') s=u.min*60; return s+(u.restAfter||0); }
function sessionTitle(kinds){ return kinds.map(k=>SECTION_SHORT[k]).join(' + '); }
function equipmentFor(kinds,opts){ const set=new Set(); const add=e=>String(e.equip||'').split(',').map(x=>x.trim()).filter(x=>x&&x!=='none').forEach(x=>set.add(x));
  kinds.forEach(k=>{ if(k==='block'||k==='A'||k==='B') SLOTS.filter(s=>s.section===k&&(!s.optional||opts.extras)).forEach(s=>add(slotEx(s.id))); if(k==='core') corePlan(opts.coreMinutes).moves.forEach(id=>add(EX[id])); }); return [...set]; }

/* ---- preview sheet ---- */
function previewSheet(kinds){
  const p=state.profile; const floor=kinds.filter(k=>['block','A','B'].includes(k)); const coreOn=p.core.on&&kinds.includes('core'); const opts={extras:p.extras,coreMinutes:p.core.minutes};
  const strength=floor.find(k=>k!=='block');
  const list=(ids)=>ids.map(id=>`<li>${esc(EX[id].name)}</li>`).join('');
  const sec=(k)=>{ if(k==='block') return `<div class="prev"><div class="prev-h"><b>${SECTION_NAME.block}</b><span>~10 min</span></div><ul>${list(SLOTS.filter(s=>s.section==='block').map(s=>slotEx(s.id).id))}</ul></div>`;
    if(k==='A'||k==='B'){ const slots=SLOTS.filter(s=>s.section===k&&!s.optional); return `<div class="prev"><div class="prev-h"><b>${SECTION_NAME[k]}</b><span>~${SECTIONS[k].minutes} min</span></div><ul>${slots.map(s=>`<li>${esc(slotEx(s.id).name)} <span class="faint">· ${targetText(s.id)}</span></li>`).join('')}</ul>
      <label class="prev-opt"><input type="checkbox" data-prev="extras" ${p.extras?'checked':''}> Add the optional extra (${esc(SLOTS.filter(s=>s.section===k&&s.optional).map(s=>slotEx(s.id).name).join(', '))}), +5 min</label></div>`; }
    if(k==='core'){ const c=corePlan(p.core.minutes); return `<div class="prev"><div class="prev-h"><label class="prev-opt" style="margin:0"><input type="checkbox" data-prev="core" ${p.core.on?'checked':''}> <b>Core finisher</b></label><span>~${Math.round(coreSeconds(p.core.minutes)/60)} min</span></div>
      <div class="row" style="margin:.3rem 0"><div class="seg2" role="group" aria-label="Core length"><button type="button" aria-pressed="${p.core.minutes<10}" data-act="coremin" data-min="5">5 min</button><button type="button" aria-pressed="${p.core.minutes>=10}" data-act="coremin" data-min="10">10 min</button></div><button class="btn sm" data-act="coreshuffle">${ICON.shuffle} Shuffle</button></div>
      <ul>${list(c.moves)}</ul><p class="tiny faint">${c.rounds} rounds · ${c.work}s on, ${c.rest}s off · all pelvis-safe: low back stays down.</p></div>`; }
    return ''; };
  const est=Math.round(buildUnits(kinds.filter(k=>k!=='core'||p.core.on),opts).reduce((a,u)=>a+estUnit(u),0)/60);
  const equip=equipmentFor(kinds.filter(k=>k!=='core'||p.core.on),opts);
  openSheet(`<div class="sheet-head"><div><div class="eyebrow">Session preview</div><h2>${esc(sessionTitle(kinds.filter(k=>k!=='core'||coreOn)))}</h2></div><button class="btn sm" data-act="closesheet" aria-label="Close">${ICON.x}</button></div>
    <div class="row"><span class="chip accent">~${est} min</span>${equip.length?`<span class="chip ghost">Needs: ${esc(equip.join(', '))}</span>`:''}</div>
    ${kinds.map(sec).join('')}
    <p class="tiny faint">Log each set as you finish it; rest starts on its own and the next exercise is already on screen. Rate the whole session at the end.</p>
    <button class="btn primary big block" data-act="startx" data-kinds="${kinds.join(',')}">${ICON.play} Start</button>`);
}

/* ---- session lifecycle ---- */
function startSession(kinds,opts){
  const p=state.profile; kinds=kinds.filter(k=>k!=='core'||p.core.on); if(!kinds.length) return;
  opts=Object.assign({extras:p.extras,coreMinutes:p.core.minutes},opts||{});
  S={kinds,opts,title:sessionTitle(kinds),units:buildUnits(kinds,opts),i:0,log:{},coreDone:0,coreTotal:0,startedAt:Date.now(),pausedAt:null,rest:null,u:{phase:'idle',side:'L'},splits:[],runSec:null,floorSec:null,ratings:{},result:null,prs:[],best:{}};
  S.coreTotal=S.units.filter(u=>u.t==='interval').length;
  S.units.forEach(u=>{ if(u.ex&&!(u.ex in S.best)) S.best[u.ex]=bestFor(u.ex); });
  closeSheet(); beep(660,60); try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  openPlayer(); gotoUnit(0);
}
function saveDraft(){ if(!S) return; try{ localStorage.setItem(SKEY,JSON.stringify({kinds:S.kinds,opts:S.opts,title:S.title,units:S.units,i:S.i,log:S.log,coreDone:S.coreDone,coreTotal:S.coreTotal,elapsed:elapsed(),splits:S.splits,runSec:S.runSec,floorSec:S.floorSec,prs:S.prs})); }catch(e){} }
function clearDraft(){ try{ localStorage.removeItem(SKEY); }catch(e){} }
function resumeDraft(){ const d=draft(); if(!d||!d.units) { clearDraft(); render(); return; } S={kinds:d.kinds,opts:d.opts||{},title:d.title,units:d.units,i:d.i,log:d.log||{},coreDone:d.coreDone||0,coreTotal:d.coreTotal||0,startedAt:Date.now()-(d.elapsed||0),pausedAt:null,rest:null,u:{phase:'idle',side:'L'},splits:d.splits||[],runSec:d.runSec,floorSec:d.floorSec,ratings:{},result:null,prs:d.prs||[],best:{}}; S.units.forEach(u=>{ if(u.ex&&!(u.ex in S.best)) S.best[u.ex]=bestFor(u.ex); }); openPlayer(); gotoUnit(S.i,true); }
const now=()=>S&&S.pausedAt?S.pausedAt:Date.now();
const elapsed=()=>S?Math.max(0,(now()-S.startedAt)/1000):0;
const cur=()=>S.units[Math.min(S.i,S.units.length-1)];
function openPlayer(){ const pl=$('#player'); pl.hidden=false; document.body.style.overflow='hidden'; keepAwake(true); clearInterval(tickTimer); tickTimer=setInterval(tick,200); }
function closePlayer(){ clearInterval(tickTimer); tickTimer=null; S=null; const pl=$('#player'); pl.hidden=true; pl.innerHTML=''; document.body.style.overflow=''; keepAwake(false); render(); }
function gotoUnit(i,resume){ S.i=Math.min(i,S.units.length-1); S.u={phase:'idle',side:'L',reps:null}; const u=cur();
  if(u.t==='finish'){ S.rest=null; if(S.floorSec==null) S.floorSec=Math.round(elapsed()); }
  else if((u.t==='run'||u.t==='walk')&&S.floorSec==null&&S.kinds.some(k=>['block','A','B','core'].includes(k))) S.floorSec=Math.round(elapsed());
  if(!S.rest&&!resume&&(u.t==='lead'||u.t==='interval')) startTimed();
  saveDraft(); buildUnit(); }
function startRest(sec,label){ if(!(sec>0)) return; S.rest={until:now()+sec*1000,total:sec,label:label||'Rest',lastBeep:null}; }
function endRest(){ S.rest=null; const u=cur(); beep(990,200); buzz(120); if(u.t==='lead'||u.t==='interval') startTimed(); else buildUnit(); }
function completeUnit(skipRest){ const u=cur(); const nx=S.units[S.i+1]; if(!skipRest&&u.restAfter>0&&nx&&nx.t!=='finish') startRest(u.restAfter,u.restLabel); gotoUnit(S.i+1); }
function startTimed(side){ const u=cur(); const dur=u.t==='set'?u.target:u.t==='interval'?u.work:u.sec; S.u.phase='hold'; S.u.side=side||'L'; S.u.startAt=now(); S.u.dur=dur; S.u.lastBeep=null; S.u.mid=false; buildUnit(); }
function finishTimed(early){ const u=cur(); const ran=Math.min(S.u.dur,Math.round((now()-S.u.startAt)/1000));
  if(u.t==='set'){ logSet(u,ran,S.u.side); if(u.perSide&&S.u.side==='L'){ S.u.phase='switch'; S.u.startAt=now(); S.u.dur=5; S.u.lastBeep=null; beep(1320,200); buildUnit(); return; } beep(1320,260); buzz(200); completeUnit(); return; }
  if(u.t==='interval'){ S.coreDone++; beep(1320,260); buzz(200); completeUnit(); return; }
  if(u.t==='lead'){ beep(1320,200); completeUnit(); return; } }
function logSet(u,val,side){ const en=S.log[u.slot]=S.log[u.slot]||{ex:u.ex,load:u.load||0,sets:[]}; en.sets.push(u.mode==='time'?{set:u.set,side:side||null,sec:val}:{set:u.set,side:side||null,reps:val});
  if(u.mode==='reps'&&val>(S.best[u.ex]||0)&&S.best[u.ex]>0){ S.best[u.ex]=val; S.prs.push({ex:u.ex,reps:val}); toast(`New best: ${val} ${EX[u.ex].name}`); } else if(val>(S.best[u.ex]||0)) S.best[u.ex]=val; }
function repsFor(u,side){ const r=S.u.reps||{}; if(r[side||'A']!=null) return r[side||'A']; const lv=lastVal(u.last,u.set,side); return lv!=null?lv:u.target; }
function sessionProgress(){ const tot=S.units.reduce((a,u)=>a+estUnit(u),0)||1; let done=0; for(let j=0;j<S.i;j++) done+=estUnit(S.units[j]); return {done,tot}; }
function timeLeft(){ let left=0; for(let j=S.i;j<S.units.length;j++) left+=estUnit(S.units[j]); if(S.rest) left+=Math.max(0,(S.rest.until-now())/1000); return Math.max(0,Math.round(left/60)); }
function exerciseIndex(){ const keys=[]; S.units.forEach(u=>{ const k=u.t==='set'?u.slot:u.t==='interval'?'core':u.t; if(k!=='finish'&&!keys.includes(k)) keys.push(k); }); const u=cur(); const k=u.t==='set'?u.slot:u.t==='interval'?'core':u.t; return {n:keys.indexOf(k)+1,of:keys.length}; }
function nextUnitLabel(){ const nx=S.units[S.i+1]; if(!nx) return ''; if(nx.t==='set') return `${EX[nx.ex].name} · set ${nx.set}`; if(nx.t==='interval') return `${EX[nx.ex].name}`; if(nx.t==='run') return 'Run'; if(nx.t==='walk') return 'Walk'; if(nx.t==='lead') return 'Core finisher'; return 'Finish'; }

/* ---- rendering ---- */
function ringSVG(cls){ return `<svg class="ring ${cls||''}" viewBox="0 0 160 160" aria-hidden="true"><circle class="track" cx="80" cy="80" r="70"/><circle id="ring-prog" class="prog" cx="80" cy="80" r="70" stroke-dasharray="0 439.8"/><text id="ring-num" class="num" x="80" y="92" text-anchor="middle">0</text><text id="ring-sub" class="sub" x="80" y="114" text-anchor="middle"></text></svg>`; }
function setTable(u){ const rows=[]; for(let k=1;k<=u.sets;k++){ const logged=(S.log[u.slot]&&S.log[u.slot].sets.filter(s=>s.set===k))||[]; const cls=k<u.set?'done':k===u.set?'cur':'todo';
    const val=(side)=>{ const hit=logged.find(s=>side?s.side===side:!s.side); if(hit) return `<b>${hit.reps??hit.sec}${u.mode==='time'?'s':''}</b>`; if(k===u.set&&S.u.phase==='hold'&&(!side||S.u.side===side)) return '<i class="live">…</i>'; const lv=lastVal(u.last,k,side); return `<span class="faint">${lv!=null?lv+(u.mode==='time'?'s':''):'–'}</span>`; };
    rows.push(`<tr class="${cls}"><td>${k}</td><td>${u.mode==='time'?u.target+'s':u.target}</td>${u.perSide?`<td>${val('L')}</td><td>${val('R')}</td>`:`<td>${val()}</td>`}</tr>`); }

function buildUnit(){
  const pl=$('#player'); if(!S||pl.hidden) return; const u=cur(); const e=u.ex?EX[u.ex]:null; const resting=!!S.rest; const paused=!!S.pausedAt; const xi=exerciseIndex();
  const segs=S.kinds.map(k=>{ const us=S.units.filter(x=>x.section===k); const tot=us.reduce((a,x)=>a+estUnit(x),0)||1; let done=0; us.forEach(x=>{ const j=S.units.indexOf(x); if(j<S.i) done+=estUnit(x); }); return `<i class="${k==='core'?'core':''}" style="--p:${Math.round(done/tot*100)}%" title="${SECTION_SHORT[k]}"></i>`; }).join('');
  const head=`<div class="phead"><div class="crumbs"><b>${SECTION_NAME[u.section]||''}</b><span>${u.t==='finish'?'Summary':`Exercise ${xi.n} of ${xi.of}`}${u.t==='set'&&u.superset?` · Superset ${u.superset}, round ${u.round} of ${u.rounds}`:''}</span></div><div class="ptimes"><b id="p-elapsed">${fmtTime(elapsed())}</b><span id="p-left">~${timeLeft()} min left</span></div><button class="btn sm" data-act="pmenu" aria-label="Session menu">⋯</button></div><div class="segbar">${segs}</div>${paused?`<div class="pausebar">Paused<button class="btn sm" data-act="ppause">Resume</button></div>`:''}`;
  let body='';

    const lvlTxt=LVL[e.level]||'Base';
    const holdUI=()=>{ const ph=S.u.phase; if(ph==='idle') return `<div class="holdbox">${ringSVG()}<div class="target">${u.perSide?`Left side first, then right. <b>${u.target}s</b> each.`:`Hold for <b>${u.target}s</b>.`} Range ${u.range[0]}-${u.range[1]}s.</div><button class="btn primary big block" data-act="pstart" ${resting?'disabled':''}>${ICON.play} ${resting?'Resting…':'Start hold'}</button></div>`;

    const repsUI=()=>`<div class="logrow">${u.perSide?`<div class="stepper"><span class="lab">Left</span><button type="button" data-act="prep" data-side="L" data-d="-1" aria-label="Left: one fewer">−</button><input type="number" inputmode="numeric" id="rep-L" value="${repsFor(u,'L')}" data-act-change="repin" data-side="L" aria-label="Left reps"><button type="button" data-act="prep" data-side="L" data-d="1" aria-label="Left: one more">+</button></div><div class="stepper"><span class="lab">Right</span><button type="button" data-act="prep" data-side="R" data-d="-1" aria-label="Right: one fewer">−</button><input type="number" inputmode="numeric" id="rep-R" value="${repsFor(u,'R')}" data-act-change="repin" data-side="R" aria-label="Right reps"><button type="button" data-act="prep" data-side="R" data-d="1" aria-label="Right: one more">+</button></div>`:`<div class="stepper"><span class="lab">Reps</span><button type="button" data-act="prep" data-side="A" data-d="-1" aria-label="One fewer">−</button><input type="number" inputmode="numeric" id="rep-A" value="${repsFor(u)}" data-act-change="repin" data-side="A" aria-label="Reps"><button type="button" data-act="prep" data-side="A" data-d="1" aria-label="One more">+</button></div>`}</div>
      <div class="tiny faint">Target ${u.target}, range ${u.range[0]}-${u.range[1]}. Stop 1-3 reps short of failure. Hit ${u.range[1]} on every set and you move up next time.</div>

    </div></div>`;
  } else if(u.t==='lead'){ body=`<div class="xcard"><div class="fig rest">${figSVG(EX[u.core.moves[0]].fig,{label:''})}</div><div class="body"><div class="xname">Core finisher</div><div class="ss">${u.core.rounds} rounds · ${u.core.work}s on, ${u.core.rest}s off</div><div class="pcue">Get into position for ${esc(EX[u.core.moves[0]].name)}. Ribs down, low back stays down the whole circuit.</div><div class="holdbox">${ringSVG('core')}${S.u.phase==='idle'&&!resting?`<button class="btn primary big block" data-act="pstart">${ICON.play} Start the circuit</button>`:''}</div><ol class="small muted" style="padding-left:1.2rem">${u.core.moves.map(id=>`<li>${esc(EX[id].name)}</li>`).join('')}</ol></div></div>`; }

  pl.innerHTML=`<div class="wrap">${head}${body}${restbar}</div>`;

  toggle:d=>{ setPath(d.path,!getPath(d.path)); Store.saveState(); render(); if(d.path==='profile.reminder.on'&&getPath(d.path)) toast('Reminder on. Allow notifications or add it to your calendar.'); },
  dayset:d=>{ const arr=getPath(d.path).slice(); const n=+d.day; const i=arr.indexOf(n); if(i>=0) arr.splice(i,1); else arr.push(n); setPath(d.path,arr); Store.saveState(); render(); },
  askNotify:async()=>{ if(typeof Notification==='undefined'){ toast(IOS?'Add the app to your Home Screen first, then allow notifications here.':'Notifications are not available in this browser.'); return; } try{ const r=await Notification.requestPermission(); toast(r==='granted'?'Notifications allowed':'Notifications not allowed here. Use the calendar option.'); }catch(e){ toast('Notifications are not available in this view. Use the calendar option.'); } render(); },
  ics:async()=>{ const txt=icsText(); const ok=await saveFile('ribs-down-reminder.ics',txt,'text/calendar'); if(!ok){ try{ await navigator.clipboard.writeText(txt); toast('Calendar file copied. Paste it into a file named ribs-down.ics and open it.'); }catch(e){ openSheet(`<div class="sheet-head"><div><h2>Calendar event</h2></div><button class="btn sm" data-act="closesheet">${ICON.x}</button></div><p class="small muted">Copy this into a file named ribs-down.ics and open it on your phone or computer.</p><textarea readonly style="min-height:14rem;font-family:monospace;font-size:.75rem">${esc(txt)}</textarea>`); } } },
  export:async()=>{ const ok=await saveFile('ribs-down-backup.json',JSON.stringify({exported:new Date().toISOString(),state,workouts},null,1),'application/json'); if(ok) toast('Backup saved'); },
  resetask:(d,el)=>{ if(el.dataset.sure!=='1'){ el.dataset.sure='1'; el.textContent='Tap again to erase everything'; return; } state=clone(DEFAULT); const ids=workouts.map(w=>w.id); workouts=[]; Store.saveState(); ids.forEach(id=>Store.deleteWorkout(id)); clearDraft(); render(); toast('Everything erased'); },
  addweight:()=>{ const v=parseFloat($('#bw-in').value); if(!v){ toast('Type a weight first'); return; } state.weights=(state.weights||[]).filter(x=>x.date!==todayKey()); state.weights.push({date:todayKey(),lb:v}); if(!state.profile.weightLb) state.profile.weightLb=Math.round(v); Store.saveState(); render(); toast('Weight logged'); },
  // player
  pmenu:()=>{ if(S) menuSheet(); },
  ppause:()=>{ if(!S) return; closeSheet(); if(S.pausedAt){ const dt=Date.now()-S.pausedAt; S.startedAt+=dt; if(S.rest) S.rest.until+=dt; if(S.u.startAt) S.u.startAt+=dt; S.pausedAt=null; } else S.pausedAt=Date.now(); buildUnit(); },
  pstart:()=>{ if(!S||S.rest) return; const u=cur(); if(u.t==='lead'||u.t==='interval'){ if(S.u.phase==='idle') startTimed(); return; } if(u.t==='run'||u.t==='walk'){ S.u.phase='run'; S.u.startAt=now(); buildUnit(); return; } if(u.t==='set'&&u.mode==='time'){ beep(660,60); startTimed('L'); } },
  phold10:()=>{ if(S&&S.u.phase==='hold'){ S.u.dur+=10; S.u.lastBeep=null; tick(); } },
  pdoneearly:()=>{ if(S&&S.u.phase==='hold') finishTimed(true); },
  prep:d=>{ if(!S) return; const u=cur(); const side=d.side; const cur=readRep(side)??repsFor(u,side==='A'?null:side); const v=Math.max(0,cur+(+d.d)); S.u.reps=S.u.reps||{}; S.u.reps[side]=v; const el=$('#rep-'+side); if(el) el.value=v; },
  plog:()=>{ if(!S||S.rest) return; const u=cur(); if(u.t!=='set'||u.mode!=='reps') return; if(u.perSide){ const l=readRep('L')??repsFor(u,'L'), r=readRep('R')??repsFor(u,'R'); logSet(u,l,'L'); logSet(u,r,'R'); } else { const v=readRep('A')??repsFor(u); logSet(u,v); } beep(990,90); completeUnit(); },
  pskipset:()=>{ if(!S) return; const u=cur(); if(u.t==='interval'){ completeUnit(); return; } S.u={phase:'idle',side:'L'}; completeUnit(true); },
  pskipex:()=>{ if(!S) return; closeSheet(); skipExercise(); },
  pskipcore:()=>{ if(!S) return; closeSheet(); skipCore(); },
  pend:()=>{ if(!S) return; closeSheet(); endSession(); },
  prest15:()=>{ if(S&&S.rest){ S.rest.until+=15000; S.rest.total+=15; S.rest.lastBeep=null; tick(); } },
  pskiprest:()=>{ if(S&&S.rest){ S.rest=null; const u=cur(); if(u.t==='lead'||u.t==='interval') startTimed(); else buildUnit(); } },
  pswap:d=>{ closeSheet(); swapSheet(d.slot); }, pswapto:d=>applySwapInSession(d.slot,d.ex),
  plap:()=>{ if(!S||S.u.phase!=='run') return; const t=(now()-S.u.startAt)/1000; const prev=S.splits.reduce((a,b)=>a+b,0); S.splits.push(Math.round(t-prev)); saveDraft(); buildUnit(); beep(880,80); },
  pmovefinish:()=>{ if(!S||S.u.phase!=='run') return; S.runSec=Math.round((now()-S.u.startAt)/1000); S.u={phase:'idle'}; completeUnit(true); },
  pquit:(d,el)=>{ if(!S) return; if(S.result){ closePlayer(); return; } closeSheet(); if(el.dataset.sure!=='1'){ el.dataset.sure='1'; toast('Tap again to leave without saving'); setTimeout(()=>{ if(el) el.dataset.sure='0'; },2500); return; } clearDraft(); closePlayer(); },
  rpe:(d)=>{ if(!S) return; S.ratings[d.which]=+d.v; document.querySelectorAll(`[data-act="rpe"][data-which="${d.which}"]`).forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===d.v)); const w=$(`#rpe-${d.which}-word`); if(w) w.textContent=`${d.v}: ${RPE_WORDS[+d.v]}`; },
  psave:()=>saveSession(), pclose:()=>closePlayer(),
};
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const fn=ACT[el.dataset.act]; if(fn){ if(el.tagName!=='LABEL') e.preventDefault(); fn(el.dataset,el,e); } });
document.addEventListener('change',e=>{ const el=e.target;
  if(el.dataset.set){ let v=el.type==='number'?(parseFloat(el.value)||0):el.value; if(el.tagName==='SELECT'&&/^\d+$/.test(v)) v=+v; if(el.dataset.set==='profile.start'&&!v) return; setPath(el.dataset.set,v); Store.saveState(); if(el.dataset.set!=='profile.name') render(); }
  if(el.dataset.prev==='extras'){ state.profile.extras=el.checked; Store.saveState(); }
  if(el.dataset.prev==='core'){ state.profile.core.on=el.checked; Store.saveState(); const kinds=[...document.querySelectorAll('[data-act="startx"]')].map(b=>b.dataset.kinds)[0]; if(kinds) previewSheet(kinds.split(',')); }
  if(el.dataset.actChange==='repin'&&S){ S.u.reps=S.u.reps||{}; const v=parseInt(el.value,10); if(!isNaN(v)) S.u.reps[el.dataset.side]=Math.max(0,v); }
  if(el.dataset.actChange==='progslot'){ progSlot=el.value; render(); }
  if(el.dataset.actChange==='import'){ const f=el.files&&el.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o.state||!Array.isArray(o.workouts)) throw 0; state=merge(DEFAULT,o.state); workouts=o.workouts; Store.saveState(); workouts.forEach(w=>Store.saveWorkout(w)); render(); toast(`Imported ${workouts.length} sessions`); }catch(err){ toast('That file is not a Ribs Down backup'); } }; rd.readAsText(f); }
});
document.addEventListener('submit',e=>e.preventDefault());
$('#sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') closeSheet(); });
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(['today','plan','progress','more'].includes(h)&&h!==tab){ tab=h; render(); } });
// chart tooltips
(function(){ let tip=null; const show=(el,x,y)=>{ const wrap=el.closest('.chart-wrap'); if(!wrap) return; if(!tip){ tip=document.createElement('div'); tip.className='tip'; } wrap.appendChild(tip); tip.textContent=el.dataset.tip; const r=wrap.getBoundingClientRect(); tip.style.left=`${clamp(x-r.left,40,r.width-40)}px`; tip.style.top=`${y-r.top}px`; };
  document.addEventListener('pointerover',e=>{ const el=e.target.closest('[data-tip]'); if(el) show(el,e.clientX,e.clientY); else if(tip&&!e.target.closest('.chart-wrap')) tip.remove(); });
  document.addEventListener('pointermove',e=>{ const el=e.target.closest('[data-tip]'); if(el) show(el,e.clientX,e.clientY); });
  document.addEventListener('pointerleave',()=>{ if(tip) tip.remove(); },true); })();
// reminders & posture breaks (while the page is open)
function notify(title, body){ toast(`${title}: ${body}`,5000); beep(880,120); setTimeout(()=>beep(1100,160),200); buzz([120,80,120]);
  if(typeof Notification==='undefined'||Notification.permission!=='granted'||document.visibilityState==='visible') return;
  const opts={body,tag:'ribsdown',icon:'icon-192.png'};
  if(navigator.serviceWorker&&navigator.serviceWorker.ready){ navigator.serviceWorker.ready.then(r=>r.showNotification(title,opts)).catch(()=>{ try{ new Notification(title,opts); }catch(e){} }); }
  else { try{ new Notification(title,opts); }catch(e){} } }
let lastPosture=Date.now();
setInterval(()=>{ const p=state.profile; const n=new Date(); const k=todayKey(n);
  if(p.reminder.on){ const hm=`${pad2(n.getHours())}:${pad2(n.getMinutes())}`; let fired=''; try{ fired=localStorage.getItem(RKEY)||''; }catch(e){}
    if(hm===p.reminder.time&&p.reminder.days.includes(n.getDay())&&fired!==k&&!doneOn(k,'block')){ try{ localStorage.setItem(RKEY,k); }catch(e){} notify('Time to train',`${dayPlan(k).map(segName).join(' + ')}. Ribs down, glutes on.`); } }
  if(p.posture.on&&!S&&Date.now()-lastPosture>=p.posture.min*60000){ lastPosture=Date.now(); notify('Posture break','Stand up. Ribs stacked over the pelvis, walk for a minute.'); }
},20000);
// boot
(function boot(){
  Store.load();
  const h=location.hash.slice(1); if(['today','plan','progress','more'].includes(h)) tab=h;
  render(); Store.connect();
  if('serviceWorker' in navigator && !IN_CLAUDE && location.protocol.startsWith('http')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
